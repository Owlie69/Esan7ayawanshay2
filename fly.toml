# Replace "esan7ayawanshay2" below with whatever app name fly.io assigns you
app = "esan7ayawanshay2"
primary_region = "cdg"  # Paris — change to nearest region (e.g. "iad" US East, "lax" US West, "sin" Singapore)

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # keep running even when idle — no sleep
  auto_start_machines = true
  min_machines_running = 1     # always at least 1 instance running

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
